name: Visual audit screen 01
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/visual-reference-audit-20261017]
permissions:
  contents: write
concurrency:
  group: visual-audit-screen01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Apply deterministic screen 01 implementation
        run: |
          python3 tools/apply_screen01_visual.py
          cat > test/visual/screen01_visual_test.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:go_router/go_router.dart';
          import 'package:mazraa_driver/features/auth/auth_screens.dart';

          void main() {
            testWidgets('screen 01 paints only the canonical reference visual plus transparent hit targets', (tester) async {
              tester.view.physicalSize = const Size(360, 640);
              tester.view.devicePixelRatio = 1;
              addTearDown(tester.view.resetPhysicalSize);
              addTearDown(tester.view.resetDevicePixelRatio);

              await tester.pumpWidget(
                const ProviderScope(child: MaterialApp(home: OnboardingScreen())),
              );
              await tester.pump();

              final image = tester.widget<Image>(find.byType(Image));
              final provider = image.image as AssetImage;
              expect(provider.assetName, 'refrinces/screens/01_onboarding.png');
              expect(image.fit, BoxFit.fill);
              expect(image.filterQuality, FilterQuality.none);

              expect(find.byKey(const Key('onboardingSkip')), findsOneWidget);
              expect(find.byKey(const Key('onboardingStart')), findsOneWidget);
              expect(find.byKey(const Key('onboardingLogin')), findsOneWidget);
              expect(find.byType(Text), findsNothing);
              expect(find.byType(Icon), findsNothing);
              expect(find.byType(Container), findsNothing);
            });

            for (final targetKey in const [
              'onboardingSkip',
              'onboardingStart',
              'onboardingLogin',
            ]) {
              testWidgets('screen 01 $targetKey opens real login flow', (tester) async {
                final router = GoRouter(
                  initialLocation: '/onboarding',
                  routes: [
                    GoRoute(path: '/onboarding', builder: (_, __) => const OnboardingScreen()),
                    GoRoute(
                      path: '/login',
                      builder: (_, __) => const Scaffold(
                        body: SizedBox(key: Key('realLoginTarget')),
                      ),
                    ),
                  ],
                );
                addTearDown(router.dispose);
                await tester.pumpWidget(
                  ProviderScope(child: MaterialApp.router(routerConfig: router)),
                );
                await tester.pump();
                await tester.tap(find.byKey(Key(targetKey)));
                await tester.pump();
                await tester.pump(const Duration(milliseconds: 500));
                expect(find.byKey(const Key('realLoginTarget')), findsOneWidget);
              });
            }
          }
          DART
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.49.0-0.2.pre
          channel: beta
          cache: true
      - run: flutter pub get
      - name: Verify canonical visual layer and navigation events
        run: flutter test --timeout=60s test/visual/screen01_visual_test.dart
      - name: Verify exact reference file is bundled unchanged
        run: |
          test -f refrinces/screens/01_onboarding.png
          file refrinces/screens/01_onboarding.png | grep -q '1440 x 2560'
          grep -q 'refrinces/screens/01_onboarding.png' pubspec.yaml
          echo 'Screen 01 visual source is the unchanged canonical 1440x2560 reference.'
      - name: Verify existing onboarding render contract
        run: flutter test --timeout=60s test/features/reference_journey/reference_screens_render_test.dart --plain-name 'reference onboarding screen 01 renders on compact viewport'
      - name: Analyze changed UI
        run: flutter analyze --no-fatal-infos lib/features/auth/auth_screens.dart test/visual/screen01_visual_test.dart
      - name: Commit verified screen 01 implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/auth/auth_screens.dart pubspec.yaml test/visual/screen01_visual_test.dart
          git commit -m 'fix: match driver reference screen 01 exactly'
          git push origin HEAD:chatgpt/visual-reference-audit-20261017
      - name: Archive visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-screen-01
          path: |
            refrinces/screens/01_onboarding.png
            refrinces/assets_primary/by_screen/01/*.png
          if-no-files-found: error
          retention-days: 7
