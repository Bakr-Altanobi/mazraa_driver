name: Remove obsolete reference helpers

on:
  push:
    branches:
      - chatgpt/driver-journey-server-sync-20261017
    paths:
      - .github/workflows/remove-reference-dead-code.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/driver-journey-server-sync-20261017
      - name: Remove helpers superseded by live performance data
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/features/reference_journey/reference_production_body.dart')
          s = p.read_text()
          s = re.sub(r"\nString _compactMoney\(Object\? amount\) \{.*?\n\}\n", "\n", s, flags=re.S)
          s = re.sub(r"\nbool _closedStatus\(String status\) \{.*?\n\}\n", "\n", s, flags=re.S)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/reference_journey/reference_production_body.dart
          git commit -m "chore: remove obsolete reference helpers"
          git push origin HEAD:chatgpt/driver-journey-server-sync-20261017
