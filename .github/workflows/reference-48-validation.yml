name: Validate 48-Screen Reference Journey

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'refrinces/assets_primary/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/reference-48-validation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'refrinces/assets_primary/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/reference-48-validation.yml'

permissions:
  contents: read

concurrency:
  group: reference-48-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-reference-journey:
    name: Validate catalog, routes and bundled assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.49.0-0.2.pre
          channel: beta
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Run router and 48-screen reference tests
        run: |
          flutter test \
            test/app/app_router_test.dart \
            test/features/reference_journey/reference_catalog_test.dart \
            test/features/reference_journey/reference_assets_bundle_test.dart \
            test/features/reference_journey/reference_asset_index_contract_test.dart \
            test/features/reference_journey/reference_screens_render_test.dart \
            test/features/reference_journey/reference_production_body_test.dart \
            test/features/shipments/driver_offers_test.dart \
            test/core/models/driver_profile_backend_enum_test.dart \
            test/features/reference_journey/reference_action_selection_test.dart \
            test/features/reference_journey/weekly_availability_editor_test.dart \
            test/core/models_test.dart \
            test/features/auth/driver_onboarding_screen_test.dart \
            test/shared/widgets/shipment_navigation_button_test.dart

      - name: Static analyze reference implementation
        run: |
          flutter analyze --no-fatal-infos \
            lib/features/reference_journey \
            lib/app/app_router.dart \
            lib/features/auth/auth_screens.dart \
            lib/features/auth/driver_onboarding_screen.dart \
            lib/features/shipments \
            lib/features/home \
            lib/shared/widgets/map_panel.dart \
            lib/shared/widgets/shipment_navigation_button.dart \
            lib/core/models/app_models.dart \
            lib/core/constants/api_endpoints.dart
