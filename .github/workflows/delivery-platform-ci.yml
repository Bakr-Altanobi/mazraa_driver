name: Delivery platform verification
on:
  push:
    branches: [chatgpt/delivery-platform-20261020]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      FIREBASE_API_KEY: ${{ secrets.DRIVER_FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.DRIVER_FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DRIVER_FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.DRIVER_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings
      - run: flutter test --reporter expanded
      - name: Configure existing Google client settings
        shell: bash
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ] && [ -n "$MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY=$MAPS_API_KEY" >> "$GITHUB_ENV"
            GOOGLE_MAPS_API_KEY="$MAPS_API_KEY"
          fi
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            echo "MAPS_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "MAPS_ENABLED=false" >> "$GITHUB_ENV"
          fi
      - name: Configure optional registered driver push application
        shell: bash
        run: |
          python3 - <<'CONFIG'
          import os,json,pathlib
          values={k:os.getenv(k,'') for k in ['FIREBASE_API_KEY','FIREBASE_APP_ID','FIREBASE_MESSAGING_SENDER_ID','FIREBASE_PROJECT_ID']}
          pathlib.Path('/tmp/driver-client-defines.json').write_text(json.dumps(values))
          print('Driver FCM client configuration present.' if all(values.values()) else 'Driver FCM requires its registered Firebase app configuration; foreground refresh remains active.')
          CONFIG
      - name: Build ARM64 test APK
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=ENABLE_GOOGLE_MAPS="$MAPS_ENABLED" --dart-define-from-file=/tmp/driver-client-defines.json
      - uses: actions/upload-artifact@v4
        with:
          name: mazraa_driver-delivery-test-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
