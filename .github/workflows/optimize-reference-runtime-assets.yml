name: Generate lightweight reference runtime assets

on:
  push:
    branches:
      - chatgpt/driver-48-reference-screens
    paths:
      - '.github/workflows/optimize-reference-runtime-assets.yml'

permissions:
  contents: write

jobs:
  optimize-reference-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: chatgpt/driver-48-reference-screens
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate exact-art runtime derivatives
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          root = Path('.')
          runtime = root / 'assets/reference_runtime'
          if runtime.exists():
              shutil.rmtree(runtime)
          runtime.mkdir(parents=True)

          # One canonical source for every unique visual used by ASSET_INDEX.csv.
          # Aliases in reference_assets.dart intentionally reuse these same pixels.
          sources = {
              'refrinces/assets_primary/by_screen/01/01_asset_brand_leaf_mark.png': 'asset_brand_leaf_mark.webp',
              'refrinces/assets_primary/by_screen/01/02_asset_driver_avatar.png': 'asset_driver_avatar.webp',
              'refrinces/assets_primary/by_screen/asset_onboarding_farm_sun.png': 'asset_onboarding_farm_sun.webp',
              'refrinces/assets_primary/by_screen/01/04_asset_route_arrow.png': 'asset_route_arrow.webp',
              'refrinces/assets_primary/common/asset_delivery_tote.png': 'asset_delivery_tote.webp',
              'refrinces/assets_primary/by_screen/asset_login_phone_otp.png': 'asset_login_phone_otp.webp',
              'refrinces/assets_primary/common/asset_identity_scan.png': 'asset_identity_scan.webp',
              'refrinces/assets_primary/by_screen/02/05_asset_support_headset.png': 'asset_support_headset.webp',
              'refrinces/assets_primary/common/asset_route_map_pin_cluster.png': 'asset_route_map_pin_cluster.webp',
              'refrinces/assets_primary/by_screen/03/02_asset_home_pin.png': 'asset_home_pin.webp',
              'refrinces/assets_primary/by_screen/03/05_asset_delivery_scooter.png': 'asset_delivery_scooter.webp',
              'refrinces/assets_primary/by_screen/04/02_asset_farm_crate.png': 'asset_farm_crate.webp',
              'refrinces/assets_primary/by_screen/04/03_asset_delivery_parcel.png': 'asset_delivery_parcel.webp',
              'refrinces/assets_primary/by_screen/05/03_asset_fresh_produce_basket.png': 'asset_fresh_produce_basket.webp',
              'refrinces/assets_primary/by_screen/asset_navigation_road_sign.png': 'asset_navigation_road_sign.webp',
              'refrinces/assets_primary/by_screen/07/04_asset_success_badge.png': 'asset_success_badge.webp',
              'refrinces/assets_primary/common/asset_document_shield.png': 'asset_document_shield.webp',
              'refrinces/assets_primary/by_screen/asset_earnings_chart_arrow.png': 'asset_earnings_chart_arrow.webp',
              'refrinces/assets_primary/common/asset_bank_transfer_card.png': 'asset_bank_transfer_card.webp',
              'refrinces/assets_primary/common/asset_cash_and_receipt.png': 'asset_cash_and_receipt.webp',
              'refrinces/assets_primary/common/asset_rating_stars.png': 'asset_rating_stars.webp',
              'refrinces/assets_primary/common/asset_car_maintenance.png': 'asset_car_maintenance.webp',
              'refrinces/assets_primary/common/asset_emergency_triangle.png': 'asset_emergency_triangle.webp',
              'refrinces/assets_primary/common/asset_qr_scanner_frame.png': 'asset_qr_scanner_frame.webp',
          }

          for source_name, output_name in sources.items():
              source = root / source_name
              if not source.is_file():
                  raise SystemExit(f'Missing canonical ASSET_INDEX source: {source_name}')
              with Image.open(source) as image:
                  image = image.convert('RGBA')
                  image.thumbnail((768, 768), Image.Resampling.LANCZOS)
                  output = runtime / output_name
                  image.save(output, 'WEBP', quality=88, method=4)
                  with Image.open(output) as check:
                      if check.format != 'WEBP':
                          raise SystemExit(f'Runtime asset is not WebP: {output}')
                      if check.width > 768 or check.height > 768:
                          raise SystemExit(f'Runtime asset exceeds display resolution: {output}')

          outputs = sorted(runtime.glob('*.webp'))
          if len(outputs) != 24:
              raise SystemExit(f'Expected 24 unique runtime assets, found {len(outputs)}')
          total = sum(item.stat().st_size for item in outputs)
          if total > 2_500_000:
              raise SystemExit(f'Runtime reference bundle unexpectedly large: {total} bytes')
          print(f'Generated {len(outputs)} runtime assets: {total} bytes total')

          # Keep the 48-screen mapping and ASSET_INDEX logical names intact; only
          # redirect canonical image paths to lightweight derivatives.
          dart_path = root / 'lib/features/reference_journey/reference_assets.dart'
          dart = dart_path.read_text(encoding='utf-8')
          replacements = {
              source: f'assets/reference_runtime/{output}'
              for source, output in sources.items()
          }
          for source, output in replacements.items():
              if source not in dart:
                  raise SystemExit(f'Expected canonical path not found in reference_assets.dart: {source}')
              dart = dart.replace(source, output)

          old_header = '''/// Canonical paths for the visual assets delivered with the 48-screen reference.\n///\n/// ASSET_INDEX.csv intentionally reuses identical visual sources between screens.\n/// To keep the APK small we package one canonical copy of each visual source and\n/// map the screen slots to that copy instead of bundling hundreds of duplicate\n/// multi-megabyte PNG files.\n'''
          new_header = '''/// Runtime visual contract for the 48-screen driver reference journey.\n///\n/// `refrinces/assets_primary/ASSET_INDEX.csv` and its original PNG files remain\n/// the design source of truth. The APK uses 768px WebP derivatives generated\n/// from those exact canonical pixels so reference art stays faithful without\n/// shipping dozens of 1920px multi-megabyte PNGs to every driver.\n'''
          if old_header not in dart:
              raise SystemExit('ReferenceAssets header changed unexpectedly; refusing blind rewrite.')
          dart = dart.replace(old_header, new_header, 1)
          dart_path.write_text(dart, encoding='utf-8')

          pubspec_path = root / 'pubspec.yaml'
          pubspec_lines = pubspec_path.read_text(encoding='utf-8').splitlines()
          filtered = []
          for line in pubspec_lines:
              stripped = line.strip()
              if stripped.startswith('- refrinces/assets_primary/'):
                  continue
              if stripped in {
                  '# ASSET_INDEX deliberately contains many duplicate PNGs. Package one',
                  '# canonical source per visual so all 48 screens use the delivered artwork',
                  '# without multiplying the APK by hundreds of megabytes.',
              }:
                  continue
              filtered.append(line)

          runtime_line = '    - assets/reference_runtime/'
          if runtime_line not in filtered:
              anchor = '    - assets/decorations/'
              try:
                  index = filtered.index(anchor) + 1
              except ValueError as error:
                  raise SystemExit('pubspec asset anchor not found') from error
              filtered[index:index] = [
                  '    # Runtime-sized derivatives of the exact ASSET_INDEX artwork. Original',
                  '    # reference PNG files remain untouched under refrinces/assets_primary/.',
                  runtime_line,
              ]
          pubspec_path.write_text('\n'.join(filtered) + '\n', encoding='utf-8')
          PY

          test -z "$(git status --porcelain -- refrinces/assets_primary)" || {
            echo 'Reference source files changed unexpectedly.'
            git status --short -- refrinces/assets_primary
            exit 1
          }

          du -ch assets/reference_runtime/*.webp | tail -1
          git diff --stat

      - name: Commit optimized runtime assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/optimize-reference-runtime-assets.yml
          git add assets/reference_runtime lib/features/reference_journey/reference_assets.dart pubspec.yaml
          git commit -m 'perf: shrink 48-screen runtime reference assets'
          git push origin HEAD:chatgpt/driver-48-reference-screens
