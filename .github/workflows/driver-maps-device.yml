name: Driver native Maps device verification
on:
  push:
    branches: [chatgpt/delivery-platform-20261020]
    paths:
      - 'tool/maps_device_smoke.dart'
      - 'tool/verify_maps_device.py'
      - '.github/workflows/driver-maps-device.yml'
      - 'android/dev-maps.properties'
      - 'lib/shared/widgets/map_panel.dart'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: driver-maps-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  maps-device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-x64 -t tool/maps_device_smoke.dart --dart-define=ENABLE_GOOGLE_MAPS=true
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            python3 tool/verify_maps_device.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-native-maps-review
          path: build/maps-device-qa/
          if-no-files-found: ignore
