name: Driver App Smoke Screenshot & Minimal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - chatgpt/fix-fast-driver-action
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/scripts/**'
      - '.github/workflows/driver-app-smoke-and-min-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/scripts/**'
      - '.github/workflows/driver-app-smoke-and-min-apk.yml'

permissions:
  contents: read

concurrency:
  group: driver-app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.49.0-0.2.pre
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  APP_ID: com.mazraa.driver
  DEBUG_APK: build/app/outputs/flutter-apk/app-debug.apk
  RELEASE_APK: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

jobs:
  android-smoke-and-min-apk:
    name: Run app, capture HomeScreen, then build minimal APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fast path: for an unchanged application source, restore only the two
      # already-compiled APKs. This avoids restoring Flutter/Gradle/NDK entirely.
      - name: Restore compiled APK cache
        id: apk-cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-apks
          key: driver-apks-v2-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('lib/**', 'assets/**', 'android/**', 'pubspec.yaml', 'pubspec.lock') }}

      # Incremental build outputs are only needed when the tiny APK cache misses.
      - name: Restore incremental Flutter build cache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        id: flutter-build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .dart_tool
            android/.gradle
            build
          key: driver-build-v2-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('lib/**', 'assets/**', 'android/**', 'pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            driver-build-v2-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
            driver-build-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Select cached or fresh APK path
        id: compiled-state
        shell: bash
        run: |
          mkdir -p "$(dirname "$DEBUG_APK")" artifacts
          reuse=false

          if [[ "${{ steps.apk-cache.outputs.cache-hit }}" == "true" \
                && -s .ci-apks/app-debug.apk \
                && -s .ci-apks/app-arm64-v8a-release.apk \
                && -s .ci-apks/app-arm64-debug.apk ]]; then
            echo 'Exact source APK cache hit; skipping the complete Flutter/Gradle toolchain.'
            cp .ci-apks/app-debug.apk "$DEBUG_APK"
            cp .ci-apks/app-arm64-v8a-release.apk "$RELEASE_APK"
            reuse=true
          elif [[ "${{ steps.flutter-build-cache.outputs.cache-hit }}" == "true" \
                  && -s "$DEBUG_APK" \
                  && -s "$RELEASE_APK" \
                  && -s .ci-apks/app-arm64-debug.apk \
                  && -f build/.ci-debug-source \
                  && -f build/.ci-release-source ]]; then
            source_hash="${{ hashFiles('lib/**', 'assets/**', 'android/**', 'pubspec.yaml', 'pubspec.lock') }}"
            if [[ "$(cat build/.ci-debug-source)" == "$source_hash" \
                  && "$(cat build/.ci-release-source)" == "$source_hash" ]]; then
              echo 'Exact incremental build cache contains verified APKs; reusing them.'
              reuse=true
            fi
          fi

          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

      # Heavy toolchain caches are restored only when source changes require a build.
      - name: Restore Flutter SDK cache
        if: steps.compiled-state.outputs.reuse != 'true'
        id: flutter-sdk-cache
        uses: actions/cache/restore@v5
        with:
          path: /opt/hostedtoolcache/flutter/beta-3.49.0-0.2.pre-x64
          key: driver-flutter-sdk-${{ runner.os }}-3.49.0-0.2.pre-v1

      - name: Restore Dart pub cache
        if: steps.compiled-state.outputs.reuse != 'true'
        id: pub-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.pub-cache
          key: driver-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            driver-pub-${{ runner.os }}-

      - name: Set up Java 17
        if: steps.compiled-state.outputs.reuse != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle cache
        if: steps.compiled-state.outputs.reuse != 'true'
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: driver-gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            driver-gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Set up pinned Flutter SDK
        if: steps.compiled-state.outputs.reuse != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: false

      - name: Restore Android native build cache
        if: steps.compiled-state.outputs.reuse != 'true'
        id: android-native-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: driver-android-native-${{ runner.os }}-ndk28.2-cmake3.22-v1

      # The emulator is always required because every run must prove the UI can launch.
      - name: Restore Android emulator cache
        id: android-emulator-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/system-images/android-35/default/x86_64
            ~/.android/avd
            ~/.android/adb*
          key: driver-emulator-${{ runner.os }}-api35-x64-v3
          restore-keys: |
            driver-emulator-${{ runner.os }}-api35-x64-v2

      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '::warning::/dev/kvm is unavailable; emulator will use software acceleration.'
          fi

      - name: Resolve Dart packages only when building
        if: steps.compiled-state.outputs.reuse != 'true'
        shell: bash
        run: |
          echo 'Resolving from the restored local pub cache first; network is only a fallback on a real miss.'
          flutter pub get --offline || flutter pub get

      # The trial key is held outside git; import it only when configured.
      - name: Configure trial Google Maps key
        if: steps.compiled-state.outputs.reuse != 'true'
        shell: bash
        env:
          TRIAL_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          if [[ -n "$TRIAL_MAPS_KEY" ]]; then
            printf '\nMAPS_API_KEY=%s\n' "$TRIAL_MAPS_KEY" >> android/local.properties
            echo 'Android Maps key configured for test builds.'
          else
            echo '::warning::Google Maps key secret is missing; configure GOOGLE_MAPS_ANDROID_API_KEY for real map tiles.'
          fi

      - name: Build x64 debug APK for HomeScreen smoke
        if: steps.compiled-state.outputs.reuse != 'true'
        shell: bash
        env:
          SOURCE_HASH: ${{ hashFiles('lib/**', 'assets/**', 'android/**', 'pubspec.yaml', 'pubspec.lock') }}
        run: |
          flutter build apk \
            --debug \
            --target-platform android-x64 \
            --dart-define=CI_SMOKE_HOME=true \
            --no-pub
          test -s "$DEBUG_APK"
          printf '%s' "$SOURCE_HASH" > build/.ci-debug-source

      - name: Boot cached emulator, run app and capture real HomeScreen
        id: smoke
        shell: bash
        run: bash .github/scripts/run-cached-emulator-smoke.sh

      - name: Upload captured HomeScreen
        uses: actions/upload-artifact@v7
        with:
          name: mazraa-driver-main-screen
          path: artifacts/main-screen.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build or reuse smallest practical arm64 release APK
        shell: bash
        env:
          SOURCE_HASH: ${{ hashFiles('lib/**', 'assets/**', 'android/**', 'pubspec.yaml', 'pubspec.lock') }}
        run: |
          mkdir -p artifacts
          if [[ "${{ steps.compiled-state.outputs.reuse }}" != "true" ]]; then
            rm -rf build/min-symbols
            flutter build apk \
              --release \
              --no-pub \
              --target-platform android-arm64 \
              --split-per-abi \
              --obfuscate \
              --split-debug-info=build/min-symbols
            printf '%s' "$SOURCE_HASH" > build/.ci-release-source
          else
            echo 'Verified compiled APK cache hit; release rebuild skipped.'
          fi

          test -s "$RELEASE_APK"
          cp "$RELEASE_APK" artifacts/mazraa-driver-arm64-release.apk
          echo "APK size:"
          du -h artifacts/mazraa-driver-arm64-release.apk
          echo "APK bytes: $(stat -c%s artifacts/mazraa-driver-arm64-release.apk)"

      - name: Upload minimal APK
        uses: actions/upload-artifact@v7
        with:
          name: mazraa-driver-minimal-arm64-apk
          path: artifacts/mazraa-driver-arm64-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Produce a real-device Debug APK without CI_SMOKE_HOME.
      - name: Build dedicated arm64 Debug APK
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "${{ steps.compiled-state.outputs.reuse }}" == "true" ]]; then
            cp .ci-apks/app-arm64-debug.apk artifacts/mazraa-driver-arm64-debug.apk
          else
            flutter build apk \\
              --debug \\
              --no-pub \\
              --target-platform android-arm64 \\
              --dart-define=ENABLE_GOOGLE_MAPS=true
            cp build/app/outputs/flutter-apk/app-debug.apk artifacts/mazraa-driver-arm64-debug.apk
          fi
          test -s artifacts/mazraa-driver-arm64-debug.apk
          unzip -Z1 artifacts/mazraa-driver-arm64-debug.apk | grep -q '^lib/arm64-v8a/libflutter.so$'
          if unzip -Z1 artifacts/mazraa-driver-arm64-debug.apk | grep -q '^lib/x86_64/libflutter.so$'; then
            echo '::error::Debug APK contains x86_64, not an arm64-only build.'
            exit 1
          fi
          du -h artifacts/mazraa-driver-arm64-debug.apk
          stat -c 'Debug APK bytes: %s' artifacts/mazraa-driver-arm64-debug.apk

      - name: Upload debug APK for Android testers
        uses: actions/upload-artifact@v7
        with:
          name: mazraa-driver-debug-arm64-apk
          path: artifacts/mazraa-driver-arm64-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Stage compiled APK cache
        if: success() && steps.apk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .ci-apks
          cp "$DEBUG_APK" .ci-apks/app-debug.apk
          cp "$RELEASE_APK" .ci-apks/app-arm64-v8a-release.apk
          cp artifacts/mazraa-driver-arm64-debug.apk .ci-apks/app-arm64-debug.apk

      - name: Save compiled APK cache
        if: success() && steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ci-apks
          key: driver-apks-v2-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('lib/**', 'assets/**', 'android/**', 'pubspec.yaml', 'pubspec.lock') }}

      - name: Upload emulator diagnostics on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: mazraa-driver-emulator-diagnostics
          path: |
            artifacts/activity-dump.txt
            artifacts/window-dump.txt
            artifacts/window.xml
            artifacts/not-ready-screen.png
            artifacts/logcat.txt
            artifacts/emulator.log
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 7

      - name: Save Flutter SDK cache
        if: always() && steps.compiled-state.outputs.reuse != 'true' && steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/hostedtoolcache/flutter/beta-3.49.0-0.2.pre-x64
          key: driver-flutter-sdk-${{ runner.os }}-3.49.0-0.2.pre-v1

      - name: Save Dart pub cache
        if: always() && steps.compiled-state.outputs.reuse != 'true' && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.pub-cache
          key: driver-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Save Gradle cache
        if: always() && steps.compiled-state.outputs.reuse != 'true' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: driver-gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}

      - name: Save Android native build cache
        if: always() && steps.compiled-state.outputs.reuse != 'true' && steps.android-native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: driver-android-native-${{ runner.os }}-ndk28.2-cmake3.22-v1

      - name: Save Android emulator cache
        if: always() && steps.android-emulator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/system-images/android-35/default/x86_64
            ~/.android/avd
            ~/.android/adb*
          key: driver-emulator-${{ runner.os }}-api35-x64-v3

      - name: Save incremental Flutter build cache
        if: success() && steps.apk-cache.outputs.cache-hit != 'true' && steps.flutter-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .dart_tool
            android/.gradle
            build
          key: driver-build-v2-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('lib/**', 'assets/**', 'android/**', 'pubspec.yaml', 'pubspec.lock') }}
