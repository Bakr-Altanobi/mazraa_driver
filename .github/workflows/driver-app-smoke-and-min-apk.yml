name: Driver App Smoke Screenshot & Minimal APK

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/fix-fast-driver-action
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/driver-app-smoke-and-min-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/driver-app-smoke-and-min-apk.yml'

permissions:
  contents: read

concurrency:
  group: driver-app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.49.0-0.2.pre
  APP_ID: com.mazraa.driver
  DEBUG_APK: build/app/outputs/flutter-apk/app-debug.apk
  RELEASE_APK: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

jobs:
  android-smoke-and-min-apk:
    name: Run app, capture screen, then build minimal APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17 with Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: true

      - name: Cache Android native toolchain and emulator
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/system-images/android-35/default/x86_64
            ~/.android/avd
            ~/.android/adb*
          key: driver-android-api35-x64-ndk28.2-cmake3.22-v2
          save-always: true

      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '::warning::/dev/kvm is unavailable; emulator will use software acceleration.'
          fi

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Build debug APK for emulator
        run: flutter build apk --debug --no-pub

      - name: Boot emulator, run app and capture main screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 2
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            mkdir -p artifacts
            adb install -r "$DEBUG_APK"
            adb shell pm clear "$APP_ID" || true
            adb shell am force-stop "$APP_ID" || true
            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1

            launched=false
            attempt=1
            while [ "$attempt" -le 30 ]; do
              resumed="$(adb shell dumpsys activity activities | grep -m 1 mResumedActivity || true)"
              echo "Foreground check $attempt: $resumed"
              if echo "$resumed" | grep -q "$APP_ID"; then
                launched=true
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done

            if [ "$launched" != true ]; then
              echo "The Mazraa Driver app did not become the resumed foreground application."
              adb shell dumpsys activity activities > artifacts/activity-dump.txt || true
              adb logcat -d > artifacts/logcat.txt || true
              exit 1
            fi

            # Give Flutter a brief moment to finish the first frame after the activity is resumed.
            sleep 3
            adb exec-out screencap -p > artifacts/main-screen.png
            test -s artifacts/main-screen.png
            file artifacts/main-screen.png

      - name: Upload captured main screen
        uses: actions/upload-artifact@v4
        with:
          name: mazraa-driver-main-screen
          path: artifacts/main-screen.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mazraa-driver-emulator-diagnostics
          path: |
            artifacts/activity-dump.txt
            artifacts/logcat.txt
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 7

      - name: Build smallest practical arm64 release APK
        run: |
          rm -rf build/min-symbols
          flutter build apk \
            --release \
            --no-pub \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/min-symbols

          test -s "$RELEASE_APK"
          cp "$RELEASE_APK" artifacts/mazraa-driver-arm64-release.apk
          echo "APK size:"
          du -h artifacts/mazraa-driver-arm64-release.apk
          echo "APK bytes: $(stat -c%s artifacts/mazraa-driver-arm64-release.apk)"

      - name: Upload minimal APK
        uses: actions/upload-artifact@v4
        with:
          name: mazraa-driver-minimal-arm64-apk
          path: artifacts/mazraa-driver-arm64-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
