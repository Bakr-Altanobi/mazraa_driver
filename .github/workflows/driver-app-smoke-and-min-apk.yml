name: Driver App Smoke Screenshot & Minimal APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/driver-app-smoke-and-min-apk.yml'

permissions:
  contents: read

jobs:
  android-smoke-and-min-apk:
    name: Run app, capture screen, then build minimal APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK for emulator
        run: flutter build apk --debug

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Boot emulator, run app and capture main screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm clear com.mazraa.driver || true
            adb shell am force-stop com.mazraa.driver || true
            adb shell monkey -p com.mazraa.driver -c android.intent.category.LAUNCHER 1
            sleep 25

            echo "Foreground activity:"
            adb shell dumpsys activity activities | grep -m 1 mResumedActivity || true

            if ! adb shell dumpsys activity activities | grep -m 1 mResumedActivity | grep -q 'com.mazraa.driver'; then
              echo 'The Mazraa Driver app is not the resumed foreground application.'
              exit 1
            fi

            adb exec-out screencap -p > artifacts/main-screen.png
            test -s artifacts/main-screen.png
            file artifacts/main-screen.png

      - name: Upload captured main screen
        uses: actions/upload-artifact@v4
        with:
          name: mazraa-driver-main-screen
          path: artifacts/main-screen.png
          if-no-files-found: error
          retention-days: 14

      - name: Build smallest practical arm64 release APK
        run: |
          rm -rf build/min-symbols
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/min-symbols

          APK='build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          test -s "$APK"
          cp "$APK" artifacts/mazraa-driver-arm64-release.apk
          echo "APK size:"
          du -h artifacts/mazraa-driver-arm64-release.apk
          echo "APK bytes: $(stat -c%s artifacts/mazraa-driver-arm64-release.apk)"

      - name: Upload minimal APK
        uses: actions/upload-artifact@v4
        with:
          name: mazraa-driver-minimal-arm64-apk
          path: artifacts/mazraa-driver-arm64-release.apk
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
