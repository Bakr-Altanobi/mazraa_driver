name: Driver App Smoke Screenshot & Minimal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - chatgpt/fix-fast-driver-action
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/scripts/**'
      - '.github/workflows/driver-app-smoke-and-min-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/scripts/**'
      - '.github/workflows/driver-app-smoke-and-min-apk.yml'

permissions:
  contents: read

concurrency:
  group: driver-app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.49.0-0.2.pre
  APP_ID: com.mazraa.driver
  DEBUG_APK: build/app/outputs/flutter-apk/app-debug.apk
  RELEASE_APK: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

jobs:
  android-smoke-and-min-apk:
    name: Run app, capture screen, then build minimal APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore Flutter SDK cache
        id: flutter-sdk-cache
        uses: actions/cache/restore@v5
        with:
          path: /opt/hostedtoolcache/flutter/beta-3.49.0-0.2.pre-x64
          key: driver-flutter-sdk-${{ runner.os }}-3.49.0-0.2.pre-v1

      - name: Restore Dart pub cache
        id: pub-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.pub-cache
          key: driver-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            driver-pub-${{ runner.os }}-

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: driver-gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            driver-gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: beta
          cache: false

      - name: Restore Android native build cache
        id: android-native-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: driver-android-native-${{ runner.os }}-ndk28.2-cmake3.22-v1

      - name: Restore Android emulator cache
        id: android-emulator-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-35/default/x86_64
            ~/.android/avd
            ~/.android/adb*
          key: driver-emulator-${{ runner.os }}-api35-x64-v2

      - name: Restore incremental Flutter build cache
        id: flutter-build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .dart_tool
            android/.gradle
            build
          key: driver-build-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('lib/**', 'assets/**', 'android/**', 'pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            driver-build-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '::warning::/dev/kvm is unavailable; emulator will use software acceleration.'
          fi

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Build x64 debug APK for emulator
        run: flutter build apk --debug --target-platform android-x64 --no-pub

      - name: Boot emulator, run app and capture main screen
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 2
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/capture-main-screen.sh

      - name: Upload captured main screen
        uses: actions/upload-artifact@v7
        with:
          name: mazraa-driver-main-screen
          path: artifacts/main-screen.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build smallest practical arm64 release APK
        shell: bash
        run: |
          rm -rf build/min-symbols
          flutter build apk \
            --release \
            --no-pub \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/min-symbols

          test -s "$RELEASE_APK"
          cp "$RELEASE_APK" artifacts/mazraa-driver-arm64-release.apk
          echo "APK size:"
          du -h artifacts/mazraa-driver-arm64-release.apk
          echo "APK bytes: $(stat -c%s artifacts/mazraa-driver-arm64-release.apk)"

      - name: Upload minimal APK
        uses: actions/upload-artifact@v7
        with:
          name: mazraa-driver-minimal-arm64-apk
          path: artifacts/mazraa-driver-arm64-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload emulator diagnostics on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: mazraa-driver-emulator-diagnostics
          path: |
            artifacts/activity-dump.txt
            artifacts/window-dump.txt
            artifacts/logcat.txt
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 7

      - name: Save Flutter SDK cache
        if: always() && steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/hostedtoolcache/flutter/beta-3.49.0-0.2.pre-x64
          key: driver-flutter-sdk-${{ runner.os }}-3.49.0-0.2.pre-v1

      - name: Save Dart pub cache
        if: always() && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.pub-cache
          key: driver-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Save Gradle cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: driver-gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}

      - name: Save Android native build cache
        if: always() && steps.android-native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: driver-android-native-${{ runner.os }}-ndk28.2-cmake3.22-v1

      - name: Save Android emulator cache
        if: always() && steps.android-emulator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-35/default/x86_64
            ~/.android/avd
            ~/.android/adb*
          key: driver-emulator-${{ runner.os }}-api35-x64-v2

      - name: Save incremental Flutter build cache
        if: always() && steps.flutter-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .dart_tool
            android/.gradle
            build
          key: driver-build-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('lib/**', 'assets/**', 'android/**', 'pubspec.yaml', 'pubspec.lock') }}
