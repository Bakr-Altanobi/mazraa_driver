name: Driver Debug ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/driver-app-smoke-and-min-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/driver-app-smoke-and-min-apk.yml'

permissions:
  contents: read

concurrency:
  group: driver-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build installable ARM64 debug APK only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.49.0-0.2.pre'
          channel: beta
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build real driver debug APK for ARM64 phones
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [[ -n "$GOOGLE_MAPS_API_KEY" ]]; then
            echo "Android Maps key configured from GitHub Actions secrets (value hidden)."
            flutter build apk --debug --target-platform android-arm64 --dart-define=ENABLE_GOOGLE_MAPS=true --no-pub
          else
            echo "::warning::GOOGLE_MAPS_API_KEY Actions secret not configured. Building without embedded Google Maps tiles."
            flutter build apk --debug --target-platform android-arm64 --dart-define=ENABLE_GOOGLE_MAPS=false --no-pub
          fi
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/mazraa-driver-arm64-debug.apk
          du -h artifacts/mazraa-driver-arm64-debug.apk
      - name: Upload only the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mazraa-driver-arm64-debug
          path: artifacts/mazraa-driver-arm64-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
