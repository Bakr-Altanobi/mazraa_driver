name: Visual Audit Screen 03 Reference

on:
  push:
    branches:
      - chatgpt/visual-audit-screen-03-20261017

permissions:
  contents: write

jobs:
  export-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: chatgpt/visual-audit-screen-03-20261017
      - name: Apply screen 03 audit corrections once
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/screen03_audit_patch.py ]; then
            python3 tools/screen03_audit_patch.py
            if ! git diff --quiet; then
              git config user.name "Bakr-Altanobi"
              git config user.email "bakrn.mac771@gmail.com"
              git add lib/features/home/home_screen.dart lib/core/models/app_models.dart .github/scripts/capture-main-screen.sh
              git commit -m "fix: align screen 03 status contract and visual smoke"
              git push origin HEAD:chatgpt/visual-audit-screen-03-20261017
            fi
          fi
      - name: Verify exact reference and assets
        shell: bash
        run: |
          set -euo pipefail
          test -s refrinces/screens/03_home_offline.png
          test -s refrinces/assets_primary/by_screen/03/01_asset_home_route_dashboard.png
          test -s refrinces/assets_primary/by_screen/03/02_asset_home_pin.png
          test -s refrinces/assets_primary/by_screen/03/03_asset_driver_avatar.png
          test -s refrinces/assets_primary/by_screen/03/04_asset_route_map_pin_cluster.png
          test -s refrinces/assets_primary/by_screen/03/05_asset_delivery_scooter.png
      - name: Upload exact screen 03 reference bundle
        uses: actions/upload-artifact@v7
        with:
          name: visual-audit-screen-03-reference
          path: |
            refrinces/screens/03_home_offline.png
            refrinces/assets_primary/by_screen/03/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
