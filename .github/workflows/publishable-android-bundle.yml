name: Build Signed Driver Android Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-android-bundle:
    name: Build publishable signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.49.0-0.2.pre
          channel: beta
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Check production secrets and prepare isolated signing
        shell: bash
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for secret in MAPS_KEY KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Required Android production secret ${secret} is missing."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          printf '\nMAPS_API_KEY=%s\n' "$MAPS_KEY" >> android/local.properties
          test -s android/key.properties
      - name: Build signed Play Store app bundle
        run: |
          flutter build appbundle --release --no-pub --dart-define=ENABLE_GOOGLE_MAPS=true
          test -s build/app/outputs/bundle/release/app-release.aab
      - name: Upload signed Android bundle
        uses: actions/upload-artifact@v7
        with:
          name: mazraa-driver-signed-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Clean signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
