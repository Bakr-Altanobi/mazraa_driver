name: mazraa_driver
description: "تطبيق مزرعتي الاحترافي للسائقين ومندوبي التوصيل."
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.12.0-327.4.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.4
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.0
  geolocator: ^14.0.1
  go_router: ^15.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.12.2
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
    - assets/branding/
    - assets/illustrations/
    - assets/maps/
    - assets/decorations/
    # Runtime-sized derivatives of the exact ASSET_INDEX artwork. Original
    # reference PNG files remain untouched under refrinces/assets_primary/.
    - assets/reference_runtime/

  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
